<!doctype html>

  <title>Тропа не найдена — Тихие маршруты</title>
  <style>
    * { box-sizing: border-box }

    h1 { font-family:Georgia,serif; font-weight:400; font-size:clamp(38px,6vw,57px); line-height:1.12; margin:17px 0 14px }
    p { color:#67796e; font-size:16px; line-height:1.7; margin:0 auto 28px; max-width:430px }
    a { display:inline-flex; align-items:center; justify-content:center; padding:14px 25px; border-radius:100px; color:white; background:#295547; text-decoration:none; font-weight:650 }
    a:hover,a:focus-visible { background:#17392f; outline-offset:4px }
  </style>
</head>
<body>
  <main class="card">
    <svg class="mountain" viewBox="0 0 620 185" role="img" aria-label="Горы и сосновый лес">

      <path d="M0 170l27-39 28 39zm76 0l31-55 32 55zm416 0l27-45 27 45zm61 0l25-38 27 38z" fill="#244b40"/>
    </svg>
    <div class="eyebrow">404 · Неизвестная тропа</div>

    <p>Этой страницы здесь нет. Ничего страшного — хорошая прогулка начинается с возвращения на знакомую тропу.</p>
